customer_email: |
  Hello,

  We are writing regarding your claim {claim_id}. Please see the update(s) below:

  {issues_body}

  If you have any questions, please do not hesitate to reach out.

  Best regards,
  Claims Processing Team

issue_fragments:
  missing_document: |
    Missing document(s): {missing_docs}
    Please upload the required document(s) at your earliest convenience.

  parse_failed: |
    We were unable to process the following document(s): {failed_docs}
    Please re-submit clear, legible copies.

  field_inconsistency: |
    Discrepancy detected in field "{field_name}":
    {inconsistency_details}
    Could you confirm which value is correct?

  field_inconsistency_warning: |
    Note: a low-confidence discrepancy was detected in field "{field_name}" and has been
    flagged for staff review. No action is required from you at this time.

  pending_review: |
    Your claim has been flagged for internal review. Our team will follow up within
    2-3 business days.

  complete: |
    Great news — all documents and fields are in order. We will proceed with
    finalising your claim shortly.

priority_reason:
  complete_oldest: "All required documents present and valid — ready to finalize. Oldest submission prioritized."
  incomplete_express: "Incomplete with fewer than 2 unresolved issues — express routing for quick customer response."
  incomplete_standard: "Incomplete claim — customer notification required."
  pending_oldest: "Requires human review — queued in order of submission date."
