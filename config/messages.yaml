conversation_summary_guideline: |
  You are maintaining a running summary of a customer's insurance claim conversation.

  Claim ID: {claim_id}

  Current summary:
  {current_summary}

  New customer reply (round {round}):
  {reply_text}

  Update the summary to capture all useful information the customer has provided.
  Be concise (3–5 sentences). Focus on:
  - Documents the customer has mentioned, promised to submit, or explained are unavailable
  - Any facts clarified (VIN, dates, amounts, names, circumstances)
  - Reasons for delays or missing documents
  - Whether the customer confirmed or disputed any previously flagged discrepancy

  Output only the updated summary text — no preamble, no labels, no commentary.

customer_message_guideline: |
  You are an insurance claims processor writing a customer-facing email about their claim.

  === CLAIM STATE ===
  {claim_context}

  === WRITING GUIDELINES ===
  - Warm and professional tone; the customer may be stressed about their situation
  - If a prior customer reply is shown above, acknowledge it briefly in your opening sentence
  - List each required action as a numbered item; name documents and fields specifically
  - For field discrepancies, quote the conflicting values so the customer knows exactly what to confirm
  - Do NOT mention internal system details (confidence scores, parse errors, file formats, system status)
  - Do NOT include information not listed in the claim state above
  - Keep the email concise: 1-2 sentence opening, numbered action items, brief closing
  - Sign off as "Claims Processing Team"

  Write the email now. Output only the email body — no subject line, no extra commentary.

# Fallback template used when LLM call fails
customer_email: |
  Hello,

  We are writing regarding your claim {claim_id}. Please see the update(s) below:

  {issues_body}

  If you have any questions, please do not hesitate to reach out.

  Best regards,
  Claims Processing Team

issue_fragments:
  missing_document: |
    Missing document(s): {missing_docs}
    Please upload the required document(s) at your earliest convenience.

  parse_failed: |
    We were unable to process the following document(s): {failed_docs}
    Please re-submit clear, legible copies.

  field_inconsistency: |
    Discrepancy detected in field "{field_name}":
    {inconsistency_details}
    Could you confirm which value is correct?

  resubmit_document: |
    A significant discrepancy was found in field "{field_name}". The document
    "{resubmit_doc}" appears to have lower reliability. Please re-submit a clearer copy.
    If you believe the document is correct as submitted, reply to confirm — otherwise our
    team will take over the review.

  field_inconsistency_warning: |
    Note: a low-confidence discrepancy was detected in field "{field_name}" and has been
    flagged for staff review. No action is required from you at this time.

  pending_review: |
    Your claim has been flagged for internal review. Our team will follow up within
    2-3 business days.

  complete: |
    Great news — all documents and fields are in order. We will proceed with
    finalising your claim shortly.

priority_reason:
  complete_oldest: "All required documents present and valid — ready to finalize. Oldest submission prioritized."
  incomplete_express: "Incomplete with fewer than 2 unresolved issues — express routing for quick customer response."
  incomplete_standard: "Incomplete claim — customer notification required."
  pending_oldest: "Requires human review — queued in order of submission date."
